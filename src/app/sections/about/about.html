<section appSection="about" theme="cream" class="section">
  <div class="container about">
    <h2 class="about__title">{{ 'about.title' | t }}</h2>

    <img
      class="about__photo"
      [src]="profile.aboutImage"
      [alt]="'about.photoAlt' | t: { name: fullName }"
      width="600"
      height="700"
      loading="lazy"
    />

    <div class="about__box">
      <p>{{ 'about.intro' | t }}</p>
      <p>{{ 'about.learning' | t }}</p>
      <p>{{ 'about.remote' | t }}</p>
      <div class="about__footer">
        <a class="btn" href="/#contact" (click)="$event.preventDefault(); navigation.goTo('contact')">
          {{ 'about.cta' | t }}
        </a>
        <app-star class="about__star" />
      </div>
    </div>
  </div>
</section>
