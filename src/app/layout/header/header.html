<header class="header">
  <div class="header__inner">
    <app-social-links class="header__social" [dark]="theme() === 'cream'" />

    <a class="header__logo" href="/" (click)="goTo('home', $event)" [attr.aria-label]="'nav.home' | t">
      <app-logo />
    </a>

    <div class="header__actions">
      <button
        type="button"
        class="lang-switch"
        (click)="i18n.toggle()"
        [attr.aria-label]="'nav.switchLanguage' | t"
        [attr.title]="'nav.switchLanguage' | t"
      >
        {{ languageCode() }}
      </button>

      <button
        type="button"
        class="burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-menu"
        [attr.aria-label]="(menuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | t"
      >
        @if (menuOpen()) {
          <svg viewBox="124 20 32 32" aria-hidden="true">
            <path
              fill="currentColor"
              d="M140.001 37.8677L133.468 44.401C133.223 44.6455 132.912 44.7677 132.534 44.7677C132.157 44.7677 131.845 44.6455 131.601 44.401C131.357 44.1566 131.234 43.8455 131.234 43.4677C131.234 43.0899 131.357 42.7788 131.601 42.5344L138.134 36.001L131.601 29.4677C131.357 29.2233 131.234 28.9122 131.234 28.5344C131.234 28.1566 131.357 27.8455 131.601 27.601C131.845 27.3566 132.157 27.2344 132.534 27.2344C132.912 27.2344 133.223 27.3566 133.468 27.601L140.001 34.1344L146.534 27.601C146.779 27.3566 147.09 27.2344 147.468 27.2344C147.845 27.2344 148.157 27.3566 148.401 27.601C148.645 27.8455 148.768 28.1566 148.768 28.5344C148.768 28.9122 148.645 29.2233 148.401 29.4677L141.868 36.001L148.401 42.5344C148.645 42.7788 148.768 43.0899 148.768 43.4677C148.768 43.8455 148.645 44.1566 148.401 44.401C148.157 44.6455 147.845 44.7677 147.468 44.7677C147.09 44.7677 146.779 44.6455 146.534 44.401L140.001 37.8677Z"
            />
          </svg>
        } @else {
          <svg viewBox="20 20 32 32" aria-hidden="true">
            <path
              fill="currentColor"
              d="M25.3333 44C24.9556 44 24.6389 43.8722 24.3833 43.6167C24.1278 43.3611 24 43.0444 24 42.6667C24 42.2889 24.1278 41.9722 24.3833 41.7167C24.6389 41.4611 24.9556 41.3333 25.3333 41.3333H46.6667C47.0444 41.3333 47.3611 41.4611 47.6167 41.7167C47.8722 41.9722 48 42.2889 48 42.6667C48 43.0444 47.8722 43.3611 47.6167 43.6167C47.3611 43.8722 47.0444 44 46.6667 44H25.3333ZM25.3333 37.3333C24.9556 37.3333 24.6389 37.2056 24.3833 36.95C24.1278 36.6944 24 36.3778 24 36C24 35.6222 24.1278 35.3056 24.3833 35.05C24.6389 34.7944 24.9556 34.6667 25.3333 34.6667H46.6667C47.0444 34.6667 47.3611 34.7944 47.6167 35.05C47.8722 35.3056 48 35.6222 48 36C48 36.3778 47.8722 36.6944 47.6167 36.95C47.3611 37.2056 47.0444 37.3333 46.6667 37.3333H25.3333ZM25.3333 30.6667C24.9556 30.6667 24.6389 30.5389 24.3833 30.2833C24.1278 30.0278 24 29.7111 24 29.3333C24 28.9556 24.1278 28.6389 24.3833 28.3833C24.6389 28.1278 24.9556 28 25.3333 28H46.6667C47.0444 28 47.3611 28.1278 47.6167 28.3833C47.8722 28.6389 48 28.9556 48 29.3333C48 29.7111 47.8722 30.0278 47.6167 30.2833C47.3611 30.5389 47.0444 30.6667 46.6667 30.6667H25.3333Z"
            />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="menu-backdrop" (click)="closeMenu()"></div>
    <nav id="main-menu" class="menu" [attr.aria-label]="'nav.openMenu' | t">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a [href]="'/#' + link.id" (click)="goTo(link.id, $event)">
              <app-star class="menu__star" />
              {{ link.label | t }}
            </a>
          </li>
        }
      </ul>
      <app-social-links class="menu__social" [dark]="theme() !== 'cream'" />
    </nav>
  }
</header>
